name: Publish Quarto Site

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/publish-pages.yml"
      - "site/**"
      - "data/**"
      - "docs/**"
      - "schemas/**"
      - "src-js/**"
      - "src-py/**"
      - "tests/**"
      - "test-py/**"
      - "package.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: npm run build
      - run: npm run test:py
      - run: PYTHONPATH=src-py python3 -m mediated_agency.scoring.summary
      - run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
