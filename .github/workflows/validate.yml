name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm run validate
      - run: npm test
      - run: python3 -m unittest discover -s test-py -v
      - run: npm run generate
      - run: npm run freshness:generated
